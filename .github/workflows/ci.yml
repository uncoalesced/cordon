# Engineered by uncoalesced

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov-fail-under=85

  cli:
    name: CLI smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Doctor
        run: cordon doctor

      - name: Sample a real process tree
        run: |
          # Python prints the child's real OS pid; bash's $! is an MSYS pid under Git Bash on Windows.
          # The child must not inherit stdout, or $(...) waits for it to exit.
          pid=$(python -c "import subprocess as s,sys; p=s.Popen([sys.executable,'-c','import time; b=bytearray(50<<20); time.sleep(30)'],stdin=s.DEVNULL,stdout=s.DEVNULL,stderr=s.DEVNULL); print(p.pid)")
          cordon sample --run-dir runs/ci --pid "$pid" --interval 0.1 --max-duration 2
          test -s runs/ci/samples.jsonl

      - name: Unique memory recorded on POSIX
        if: runner.os != 'Windows'
        run: grep -q '"mem_mb_unique"' runs/ci/samples.jsonl

      - name: Drive the hook entrypoint end to end
        env:
          CORDON_RUN_ROOT: ${{ github.workspace }}/runs
        run: |
          echo '{"hook_event_name":"SessionStart","session_id":"hookci"}' | cordon hook
          echo '{"hook_event_name":"PreToolUse","session_id":"hookci","tool_name":"Bash","tool_input":{"command":"pytest -q"}}' | cordon hook
          sleep 1
          echo '{"hook_event_name":"PostToolUse","session_id":"hookci","tool_name":"Bash","tool_input":{"command":"pytest -q"},"tool_response":{"exit_code":0}}' | cordon hook
          echo '{"hook_event_name":"SessionEnd","session_id":"hookci"}' | cordon hook
          grep -q '"event": "tool_start"' runs/hookci/markers.jsonl
          grep -q '"event": "tool_end"' runs/hookci/markers.jsonl
          test -s runs/hookci/cordon.log
          for i in $(seq 1 30); do [ -s runs/hookci/report.md ] && break; sleep 0.5; done
          grep -q "Comparison against the paper" runs/hookci/report.md

      - name: Report and status
        env:
          CORDON_RUN_ROOT: ${{ github.workspace }}/runs
        run: |
          cordon report --last | grep -q "Comparison against the paper"
          cordon status

      - name: Aggregate analyze
        run: |
          cordon analyze --runs runs --out findings.md
          grep -q "Comparison against the paper" findings.md

      - name: Preview hook settings without writing them
        run: |
          cordon install-hooks
          cordon install-hooks --agent hermes

  linux-cgroup-e2e:
    name: Linux enforcement e2e (real cgroup v2)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Probe as user
        run: cordon control probe || true

      - name: Enforce as user (delegated / systemd-run / advisory)
        run: python scripts/e2e_control.py

      - name: Enforce as root (cgroup2 at the mount root)
        run: sudo -E env "PATH=$PATH" python scripts/e2e_control.py --expect cgroup2

  macos-advisory-e2e:
    name: macOS advisory e2e
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Probe
        run: cordon control probe || true

      - name: Enforce (advisory watchdog)
        run: python scripts/e2e_control.py --expect advisory
