# Engineered by uncoalesced

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov-fail-under=85

  cli:
    name: CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Sample a real process tree
        run: |
          sleep 30 &
          cordon sample --run-dir runs/ci --pid $! --interval 0.1 --max-duration 2
          test -s runs/ci/samples.jsonl

      - name: Drive the hook entrypoint
        env:
          CORDON_RUN_ROOT: ${{ github.workspace }}/runs
        run: |
          echo '{"hook_event_name":"PreToolUse","session_id":"hookci","tool_name":"Bash","tool_input":{"command":"pytest -q"}}' | cordon hook
          echo '{"hook_event_name":"PostToolUse","session_id":"hookci","tool_name":"Bash","tool_input":{"command":"pytest -q"},"tool_response":{"exit_code":0}}' | cordon hook
          echo '{"hook_event_name":"SessionEnd","session_id":"hookci"}' | cordon hook
          grep -q '"event": "tool_start"' runs/hookci/markers.jsonl
          grep -q '"event": "tool_end"' runs/hookci/markers.jsonl

      - name: Reduce and analyze
        run: |
          cordon reduce --run-dir runs/hookci
          cordon analyze --runs runs --out findings.md
          test -s findings.md
          grep -q "Comparison against the paper" findings.md

      - name: Preview hook settings without writing them
        run: cordon install-hooks --target .
